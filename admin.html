<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; connect-src 'self' http://localhost http://127.0.0.1 https: wss:; font-src 'self' data: https:; media-src 'self' https:;" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Hope Alive Radio - Admin Portal</title>
    <style>html, body { height: 100%; margin: 0; background-color: #f0f4f8; } html.dark, html.dark body { background-color: #121212; } #root { height: 100%; }</style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            registration.unregister();
          }
        });
      }
    </script>
    <script type="module" src="/src/admin-main.tsx"></script>
  </body>
</html>
